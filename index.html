<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Quilla NIIMBOT</title>
</head>

<body>
  <h1>QUILLA AUTO REPAIR</h1>
  <h2>NIIMBOT B1</h2>

  <button onclick="conectar()">CONECTAR B1</button>
  <button onclick="vistaPrevia()">VISTA PREVIA</button>
  <button onclick="imprimirEtiqueta()">IMPRIMIR ETIQUETA</button>
  <p id="estado">Lista para conectar</p>
<p id="datos">Esperando datos de Google Sheets...</p>
  <canvas id="previewEtiqueta" width="384" height="240"
        style="border:1px solid black; width:384px; height:240px;"></canvas>
  <script src="https://iscarelli.github.io/niimbot-web-bluetooth/src/niimbot.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    let datosEtiqueta = null;
    async function conectar() {
      const estado = document.getElementById("estado");

      const model = {
        name_prefixes: ["B1"],
        task: "b1",
        density: 3,
        label_type: 1,
        speed: 1
      };

      try {
        estado.textContent = "Buscando NIIMBOT...";
        const info = await Niimbot.identify(model);
        estado.textContent =
          "Conectada: " + (info.label || "NIIMBOT B1");
      } catch (error) {
        estado.textContent = "Error: " + error.message;
      }
    }

    async function cargarDatos() {
  const datos = document.getElementById("datos");

  try {
    const respuesta = await fetch("https://script.google.com/macros/s/AKfycbwxck0wYYL8yLzdZrFMfbuVcR6Wwr9CU4pdt4QS13Lcv3qNPmWFEdFHv_Xs-pzmtTgd/exec?json=1");
    const d = await respuesta.json();
    datosEtiqueta = d;

    datos.innerHTML =
      "Consecutivo: " + d.consecutivo + "<br>" +
      "Placa: " + d.placa + "<br>" +
      "Millaje: " + d.millaje + "<br>" +
      "Fecha: " + d.fecha + "<br>" +
      "Aceite: " + d.aceite;
  } catch (error) {
    datos.textContent = "Error cargando datos: " + error.message;
  }
}

function vistaPrevia() {
  const estado = document.getElementById("estado");

  if (!datosEtiqueta) {
    estado.textContent = "Los datos todavía no están cargados";
    return;
  }

  const canvas = document.getElementById("previewEtiqueta");
  canvas.width = 384;
  canvas.height = 240;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, 384, 240);

  ctx.fillStyle = "black";
  ctx.strokeStyle = "black";

  // =========================
  // LOGO
  // =========================
  ctx.font = "900 italic 40px Arial";
  ctx.textAlign = "center";
  ctx.fillText("QUILLA", 112, 39);

  ctx.font = "900 italic 16px Arial";
  ctx.fillText("AUTO REPAIR", 112, 57);

  // Líneas laterales como el logo original
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(13, 53);
  ctx.lineTo(43, 53);
  ctx.moveTo(181, 53);
  ctx.lineTo(212, 53);
  ctx.stroke();

  // =========================
  // CAJAS
  // =========================
  function caja(y, texto, fontSize = 20) {
    ctx.lineWidth = 2;
    ctx.strokeRect(68, y, 147, 32);

    ctx.font = `500 ${fontSize}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(texto, 141.5, y + 16);

    ctx.textBaseline = "alphabetic";
  }

  caja(69, datosEtiqueta.consecutivo, 21);
  caja(108, datosEtiqueta.millaje, 20);
  caja(147, datosEtiqueta.fecha, 18);
  caja(186, datosEtiqueta.aceite, 21);

  // =========================
  // #
  // =========================
  ctx.textAlign = "center";
  ctx.font = "900 35px Arial";
  ctx.fillText("#", 38, 96);

  // =========================
  // ODÓMETRO
  // =========================
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.arc(38, 126, 20, Math.PI, 0);
  ctx.stroke();

  // aguja
  ctx.beginPath();
  ctx.moveTo(38, 126);
  ctx.lineTo(50, 116);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(38, 126, 4, 0, Math.PI * 2);
  ctx.fill();

  // marcas
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(19, 123); ctx.lineTo(25, 124);
  ctx.moveTo(23, 113); ctx.lineTo(28, 117);
  ctx.moveTo(38, 106); ctx.lineTo(38, 113);
  ctx.moveTo(53, 113); ctx.lineTo(48, 117);
  ctx.moveTo(57, 123); ctx.lineTo(51, 124);
  ctx.stroke();

  // =========================
  // CALENDARIO
  // =========================
  ctx.lineWidth = 3;
  ctx.strokeRect(18, 153, 40, 29);

  ctx.beginPath();
  ctx.moveTo(18, 161);
  ctx.lineTo(58, 161);
  ctx.stroke();

  ctx.fillRect(24, 166, 7, 5);
  ctx.fillRect(35, 166, 7, 5);
  ctx.fillRect(46, 166, 7, 5);
  ctx.fillRect(24, 174, 7, 5);
  ctx.fillRect(35, 174, 7, 5);
  ctx.fillRect(46, 174, 7, 5);

  // =========================
  // ACEITERA
  // =========================
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.moveTo(16, 201);
  ctx.lineTo(26, 193);
  ctx.lineTo(47, 197);
  ctx.lineTo(55, 207);
  ctx.lineTo(27, 207);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(46, 197);
  ctx.lineTo(59, 192);
  ctx.lineTo(61, 196);
  ctx.lineTo(51, 201);
  ctx.fill();

  // gota
  ctx.beginPath();
  ctx.moveTo(58, 211);
  ctx.quadraticCurveTo(64, 201, 68, 211);
  ctx.quadraticCurveTo(64, 221, 58, 211);
  ctx.fill();

  // =========================
  // QR
  // =========================
  const qrContenedor = document.createElement("div");

  new QRCode(qrContenedor, {
    text: datosEtiqueta.qr,
    width: 145,
    height: 145,
    correctLevel: QRCode.CorrectLevel.M
  });

  const qrCanvas = qrContenedor.querySelector("canvas");

  if (qrCanvas) {
    ctx.drawImage(qrCanvas, 231, 14, 145, 145);
  }

  // =========================
  // SCAN SERVICE HISTORY
  // =========================
  ctx.fillStyle = "black";
  ctx.font = "900 italic 11px Arial";
  ctx.textAlign = "center";
  ctx.fillText("SCAN SERVICE HISTORY", 303, 181);

  ctx.textAlign = "start";

  estado.textContent = "Vista previa lista";
}

    
    async function imprimirEtiqueta() {
  const estado = document.getElementById("estado");

  try {
    if (!datosEtiqueta) {
  throw new Error("Los datos de Google Sheets todavía no están cargados");
}
    estado.textContent = "Preparando etiqueta...";

const canvas = document.createElement("canvas");
    canvas.width = 384;
    canvas.height = 240;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, 384, 240);

    ctx.fillStyle = "black";
    ctx.font = "bold 28px Arial";
    ctx.fillText("QUILLA AUTO REPAIR", 20, 40);

    ctx.font = "24px Arial";
ctx.fillText("Placa: " + datosEtiqueta.placa, 20, 80);
ctx.fillText("Millaje: " + datosEtiqueta.millaje, 20, 115);
ctx.fillText("Fecha: " + datosEtiqueta.fecha, 20, 150);
ctx.fillText("Aceite: " + datosEtiqueta.aceite, 20, 185);

estado.textContent = "Enviando etiqueta a la B1...";
const imagen = canvas.toDataURL("image/png");

const model = {
  name_prefixes: ["B1"],
  task: "b1",
  density: 3,
  label_type: 1,
  speed: 1
};

const size = {
  w_px: 384,
  h_px: 240,
  dpi: 203
};

await Niimbot.printImage(imagen, {
  model: model,
  size: size,
  density: 3
});
estado.textContent = "Etiqueta impresa";

  } catch (error) {
    estado.textContent = "Error: " + error.message;
  }
}

cargarDatos();
  </script>
</body>
</html>
