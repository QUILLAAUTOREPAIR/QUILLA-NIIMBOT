<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Quilla NIIMBOT</title>
</head>

<body>
  <h1>QUILLA AUTO REPAIR</h1>
  <h2>NIIMBOT B1</h2>

  <button onclick="conectar()">CONECTAR B1</button>
  <button onclick="vistaPrevia()">VISTA PREVIA</button>
  <button onclick="imprimirEtiqueta()">IMPRIMIR ETIQUETA</button>
  <p id="estado">Lista para conectar</p>
<p id="datos">Esperando datos de Google Sheets...</p>
  <canvas id="previewEtiqueta" width="384" height="240"
        style="border:1px solid black; width:384px; height:240px;"></canvas>
  <script src="https://iscarelli.github.io/niimbot-web-bluetooth/src/niimbot.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    let datosEtiqueta = null;
    async function conectar() {
      const estado = document.getElementById("estado");

      const model = {
        name_prefixes: ["B1"],
        task: "b1",
        density: 3,
        label_type: 1,
        speed: 1
      };

      try {
        estado.textContent = "Buscando NIIMBOT...";
        const info = await Niimbot.identify(model);
        estado.textContent =
          "Conectada: " + (info.label || "NIIMBOT B1");
      } catch (error) {
        estado.textContent = "Error: " + error.message;
      }
    }

    async function cargarDatos() {
  const datos = document.getElementById("datos");

  try {
    const respuesta = await fetch("https://script.google.com/macros/s/AKfycbwxck0wYYL8yLzdZrFMfbuVcR6Wwr9CU4pdt4QS13Lcv3qNPmWFEdFHv_Xs-pzmtTgd/exec?json=1");
    const d = await respuesta.json();
    datosEtiqueta = d;

    datos.innerHTML =
      "Consecutivo: " + d.consecutivo + "<br>" +
      "Placa: " + d.placa + "<br>" +
      "Millaje: " + d.millaje + "<br>" +
      "Fecha: " + d.fecha + "<br>" +
      "Aceite: " + d.aceite;
  } catch (error) {
    datos.textContent = "Error cargando datos: " + error.message;
  }
}

function vistaPrevia() {
  const estado = document.getElementById("estado");

  if (!datosEtiqueta) {
    estado.textContent = "Los datos todavía no están cargados";
    return;
  }

  const canvas = document.getElementById("previewEtiqueta");
  canvas.width = 384;
  canvas.height = 240;

  const ctx = canvas.getContext("2d");

  // Fondo
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, 384, 240);

  ctx.fillStyle = "black";
  ctx.strokeStyle = "black";
  ctx.lineWidth = 2;

  // ===== LOGO / ENCABEZADO =====
  ctx.font = "bold italic 38px Arial";
  ctx.fillText("QUILLA", 12, 38);

  ctx.font = "bold italic 15px Arial";
  ctx.fillText("AUTO REPAIR", 48, 56);

  // ===== CAJAS DE DATOS =====
  function caja(y, texto) {
    ctx.lineWidth = 2;
    ctx.strokeRect(62, y, 158, 36);

    ctx.font = "bold 20px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(texto, 141, y + 18);

    ctx.textAlign = "start";
    ctx.textBaseline = "alphabetic";
  }

  caja(66, datosEtiqueta.consecutivo);
  caja(108, datosEtiqueta.millaje);
  caja(150, datosEtiqueta.fecha);
  caja(192, datosEtiqueta.aceite);

  // ===== ICONO # =====
  ctx.font = "bold 36px Arial";
  ctx.fillText("#", 18, 96);

  // ===== ICONO ODÓMETRO =====
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(37, 126, 19, Math.PI, 0);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(37, 126);
  ctx.lineTo(50, 116);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(37, 126, 4, 0, Math.PI * 2);
  ctx.fill();

  // Marcas del odómetro
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(19, 122); ctx.lineTo(24, 123);
  ctx.moveTo(23, 112); ctx.lineTo(27, 116);
  ctx.moveTo(37, 107); ctx.lineTo(37, 113);
  ctx.moveTo(51, 112); ctx.lineTo(47, 116);
  ctx.moveTo(55, 122); ctx.lineTo(50, 123);
  ctx.stroke();

  // ===== ICONO CALENDARIO =====
  ctx.lineWidth = 3;
  ctx.strokeRect(19, 158, 37, 29);

  ctx.beginPath();
  ctx.moveTo(19, 166);
  ctx.lineTo(56, 166);
  ctx.stroke();

  ctx.fillRect(26, 171, 6, 5);
  ctx.fillRect(36, 171, 6, 5);
  ctx.fillRect(46, 171, 6, 5);
  ctx.fillRect(26, 179, 6, 5);
  ctx.fillRect(36, 179, 6, 5);
  ctx.fillRect(46, 179, 6, 5);

  // ===== ICONO ACEITE =====
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(18, 213);
  ctx.lineTo(26, 203);
  ctx.lineTo(46, 207);
  ctx.lineTo(53, 218);
  ctx.lineTo(27, 218);
  ctx.closePath();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(46, 207);
  ctx.lineTo(58, 203);
  ctx.stroke();

  // Gota
  ctx.beginPath();
  ctx.moveTo(55, 220);
  ctx.quadraticCurveTo(61, 211, 65, 220);
  ctx.quadraticCurveTo(61, 229, 55, 220);
  ctx.fill();

  // ===== QR =====
  const qrContenedor = document.createElement("div");

  new QRCode(qrContenedor, {
    text: datosEtiqueta.qr,
    width: 142,
    height: 142,
    correctLevel: QRCode.CorrectLevel.M
  });

  const qrCanvas = qrContenedor.querySelector("canvas");

  if (qrCanvas) {
    ctx.drawImage(qrCanvas, 234, 12, 142, 142);
  }

  // ===== TEXTO QR =====
  ctx.font = "bold italic 14px Arial";
  ctx.textAlign = "center";
  ctx.fillText("SCAN SERVICE", 305, 178);
  ctx.fillText("HISTORY", 305, 195);

  ctx.textAlign = "start";

  estado.textContent = "Vista previa lista";
}

    
    async function imprimirEtiqueta() {
  const estado = document.getElementById("estado");

  try {
    if (!datosEtiqueta) {
  throw new Error("Los datos de Google Sheets todavía no están cargados");
}
    estado.textContent = "Preparando etiqueta...";

const canvas = document.createElement("canvas");
    canvas.width = 384;
    canvas.height = 240;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, 384, 240);

    ctx.fillStyle = "black";
    ctx.font = "bold 28px Arial";
    ctx.fillText("QUILLA AUTO REPAIR", 20, 40);

    ctx.font = "24px Arial";
ctx.fillText("Placa: " + datosEtiqueta.placa, 20, 80);
ctx.fillText("Millaje: " + datosEtiqueta.millaje, 20, 115);
ctx.fillText("Fecha: " + datosEtiqueta.fecha, 20, 150);
ctx.fillText("Aceite: " + datosEtiqueta.aceite, 20, 185);

estado.textContent = "Enviando etiqueta a la B1...";
const imagen = canvas.toDataURL("image/png");

const model = {
  name_prefixes: ["B1"],
  task: "b1",
  density: 3,
  label_type: 1,
  speed: 1
};

const size = {
  w_px: 384,
  h_px: 240,
  dpi: 203
};

await Niimbot.printImage(imagen, {
  model: model,
  size: size,
  density: 3
});
estado.textContent = "Etiqueta impresa";

  } catch (error) {
    estado.textContent = "Error: " + error.message;
  }
}

cargarDatos();
  </script>
</body>
</html>
